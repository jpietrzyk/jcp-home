name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-checks:
    name: Web Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: pnpm
          cache-dependency-path: dev/web/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:run

      - name: Build
        run: pnpm run build

  sanity-typecheck:
    name: Sanity Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/sanity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: dev/sanity/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
